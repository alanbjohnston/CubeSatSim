pcm.!default {
    type asym
    playback.pcm "softvol"
    capture.pcm "shared_mic"
}

ctl.!default {
    type hw
    card "Device"
}

# Playback with software volume and mixing
pcm.softvol {
    type softvol
    slave.pcm "shared_speaker"
    control {
        name "Master"
        card "Device"
    }
}

pcm.shared_speaker {
    type dmix
    ipc_key 1024
    ipc_perm 0666
    slave {
        pcm "hw:CARD=Device,DEV=0"
        rate 48000
        period_time 0
        period_size 1024
        buffer_size 4096
    }
}

# Recording with input mixing
pcm.shared_mic_raw {
    type dsnoop

    ipc_key 2048
    ipc_perm 0666

    slave {
        pcm "hw:CARD=Device,DEV=0"
        channels 1
        rate 48000
        period_size 1024
        buffer_size 4096
    }
}

pcm.shared_mic {
    type softvol

    slave.pcm "shared_mic_raw"

    control {
        name "MicVolume"
        card 2
    }
}
